name: ci

on:
  push:
  pull_request:

jobs:
  offline-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11/3.12 are advertised in pyproject classifiers but not run here.
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (protobuf runtime dep)
        run: python -m pip install .
      - name: Run offline unit, socket contract, security and launcher tests
        run: python -m unittest -v
      - name: Verify selected historical bugs are detected
        run: python -m tests.check_regressions
      - name: Verify installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I -c "import muse_gateway, muse_devin, muse_devin_wire, muse_capture, muse_models, devin_pb2, providers; print('Installed runtime imports and provider catalogs OK')"
      - name: Console-script smokes outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          muse-gateway launch -h
          muse-shim --help
          muse-gateway --version
      - name: Parse the PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/muse-gateway.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

  # Actual Muse acceptance is an explicit pre-release gate documented in
  # CONTRIBUTING.md, not an implicitly skipped check on hosted runners.
  # Offline green does not certify live accounts or a Muse TUI release.

  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package (protobuf runtime dep)
        run: python -m pip install .
      - name: Check launcher syntax
        run: bash -n muse-gateway
      - name: Check launch help renders
        run: python -m muse_gateway launch -h
      - name: Reject committed secrets and private endpoints
        run: |
          set -euo pipefail
          git ls-files -z > "$RUNNER_TEMP/gateway-tracked-files"
          while IFS= read -r -d '' path; do
            case "/$path" in
              */.env.example) ;;
              */.env|*/.env.*|*/CARRYOVER.md|*/auth.json|*/.credentials.json|*/secrets/*|*/.private/*|*.log|*.log.*|*.pem|*.key)
                echo "error: forbidden private file is tracked" >&2
                exit 1 ;;
            esac
            # Never echo matching lines: CI logs must not disclose the secret.
            if grep -E 'sk-[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+' -- "$path" > /dev/null; then
              echo "error: possible secret or private endpoint in a tracked file" >&2
              exit 1
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "error: public-surface scan could not read a tracked file" >&2
                exit "$status"
              fi
            fi
          done < "$RUNNER_TEMP/gateway-tracked-files"
