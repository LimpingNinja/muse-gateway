[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-gateway"
version = "0.5.0"
description = "Unofficial loopback gateway: Muse Spark plus Codex, Claude, and local/LiteLLM models in one Muse /model menu (muse-shim fork)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "muse-gateway contributors" }, { name = "muse-shim contributors" }]
keywords = [
  "muse",
  "muse-code",
  "meta-muse-code",
  "model-provider-shim",
  "openai-responses-api",
  "codex-oauth",
  "claude-code-oauth",
  "claude-code-cli",
  "claude-print-mode",
  "anthropic-messages-api",
  "openrouter",
  "local-proxy",
  "ai-coding-agent",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development",
]
dependencies = [
    # Single runtime dependency: protobuf for the Devin provider's generated
    # bindings. Everything else is stdlib-only.
    "protobuf>=7.35.1",
]

[project.urls]
Homepage = "https://github.com/LimpingNinja/muse-gateway"
Repository = "https://github.com/LimpingNinja/muse-gateway"
Issues = "https://github.com/LimpingNinja/muse-gateway/issues"
Documentation = "https://github.com/LimpingNinja/muse-gateway#readme"
Upstream = "https://github.com/luckeyfaraday/muse-shim"

[project.scripts]
muse-gateway = "muse_gateway:main"
muse-shim = "muse_gateway:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
py-modules = ["muse_gateway", "muse_shim", "muse_providers", "muse_devin", "muse_devin_wire", "devin_pb2", "muse_capture"]
