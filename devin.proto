// Focused Devin wire schema for muse-gateway.
//
// Wire-compatible subset of oh-my-pi @ 818dd42:
//   packages/ai/src/providers/devin/proto/...
// Field numbers, types, repeated fields, oneofs, and enum values are
// preserved exactly; only unused fields/messages are omitted. Protobuf
// decoders skip unknown fields, so a subset schema interoperates fully.
// OMP package names are NOT preserved (a single-file subset shares one
// package); message/type names never appear on the wire. Each message
// cites its OMP source for auditability.
//
// NOTE: reserved numbers/names from OMP are intentionally not repeated
// here; this file only declares what the gateway sets or reads.

syntax = "proto3";

package muse.gateway.devin;

// exa.codeium_common_pb.DisplayOption (codeium_common.proto:1400), verbatim.
// Discovery also sends raw ints 6/7/8 here (no OMP enum names exist); the
// gateway sets those as plain ints.
enum DisplayOption {
  DISPLAY_OPTION_UNSPECIFIED = 0;
  DISPLAY_OPTION_ARENA = 1;
  DISPLAY_OPTION_BATTLE_GROUP_ONLY = 2;
  DISPLAY_OPTION_MODEL_ROUTER = 3;
  DISPLAY_OPTION_QUICK_REVIEW = 4;
}

// exa.codeium_common_pb.Metadata (codeium_common.proto:2320), subset: only
// fields the Devin auth/discovery/chat paths set or read.
message Metadata {
  string ide_name = 1;
  string extension_version = 2;
  string api_key = 3;
  string locale = 4;
  string os = 5;
  string ide_version = 7;
  string extension_name = 12;
  string user_jwt = 21;
  string ide_type = 28;
  repeated DisplayOption supported_model_displays = 30;
}

// exa.auth_pb.GetUserJwtRequest (auth.proto), complete.
message GetUserJwtRequest {
  Metadata metadata = 1;
}

// exa.auth_pb.GetUserJwtResponse (auth.proto), complete.
message GetUserJwtResponse {
  string user_jwt = 1;
  string custom_api_server_url = 2;
}

// ---------------------------------------------------------------------------
// Model discovery (GetCliModelConfigs). Subset per OMP
// packages/catalog/src/discovery/devin.ts: only fields the normalizer reads.
// ---------------------------------------------------------------------------

// exa.codeium_common_pb.ModelDimensionKind, verbatim.
enum ModelDimensionKind {
  MODEL_DIMENSION_KIND_UNSPECIFIED = 0;
  MODEL_DIMENSION_KIND_COST = 1;
  MODEL_DIMENSION_KIND_COST_FUZZY = 2;
}

// exa.codeium_common_pb.ModelDimension (codeium_common.proto:2491), subset.
message ModelDimension {
  string label = 1;
  float value = 2;
  string denominator = 3;
  ModelDimensionKind kind = 6;
}

// exa.codeium_common_pb.ModelFeatures (codeium_common.proto:2972), subset.
message ModelFeatures {
  bool supports_images = 11;
  bool supports_tool_calls = 12;
  bool supports_thinking = 15;
  bool supports_parallel_tool_calls = 21;
}

// exa.codeium_common_pb.ModelInfo (codeium_common.proto:3043), subset.
message ModelInfo {
  ModelFeatures model_features = 6;
  int32 max_output_tokens = 13;
  repeated string harness_uids = 20;
  DisplayOption display_option = 22;
  bool is_model_router = 25;
}

// exa.codeium_common_pb.ModelFamilyMetadataValue (:3072), complete.
message ModelFamilyMetadataValue {
  int32 order = 1;
  string name = 2;
}

// exa.codeium_common_pb.ModelFamilyMetadataEntry (:3077), complete.
message ModelFamilyMetadataEntry {
  string key = 1;
  ModelFamilyMetadataValue value = 2;
}

// exa.codeium_common_pb.ModelFamilyMetadata (:3082), complete.
message ModelFamilyMetadata {
  string model_family_label = 1;
  repeated ModelFamilyMetadataEntry entries = 2;
  bool is_default_model_in_family = 3;
}

// exa.codeium_common_pb.ClientModelConfig (codeium_common.proto:2507),
// subset. OMP never reads model_or_alias, pricing fields, tiers, promo,
// capacity, cost tier, or disabled_reason here.
message ClientModelConfig {
  string label = 1;
  bool disabled = 4;
  bool supports_images = 5;
  bool is_beta = 9;
  bool is_recommended = 11;
  bool is_new = 15;
  int32 max_tokens = 18;
  string model_uid = 22;
  ModelInfo model_info = 23;
  optional string description = 27;
  ModelFamilyMetadata model_family_metadata = 30;
  bool is_default_model_in_family = 31;
  repeated ModelDimension model_dimensions = 32;
}

// exa.codeium_common_pb.DefaultOverrideModelConfig (:2545), subset.
message DefaultOverrideModelConfig {
  string model_uid = 3;
}

// exa.api_server_pb.GetCliModelConfigsRequest (api_server.proto:1235).
message GetCliModelConfigsRequest {
  Metadata metadata = 1;
}

// exa.api_server_pb.GetCliModelConfigsResponse (api_server.proto:1242).
message GetCliModelConfigsResponse {
  repeated ClientModelConfig client_model_configs = 1;
  optional DefaultOverrideModelConfig default_override_model_config = 3;
}

// ---------------------------------------------------------------------------
// History / tools (exa.chat_pb). Subset per OMP providers/devin.ts
// buildChatMessagePrompts: only fields OMP sets.
// ---------------------------------------------------------------------------

// exa.codeium_common_pb.ChatMessageSource, verbatim.
enum ChatMessageSource {
  CHAT_MESSAGE_SOURCE_UNSPECIFIED = 0;
  CHAT_MESSAGE_SOURCE_USER = 1;
  CHAT_MESSAGE_SOURCE_SYSTEM = 2;
  CHAT_MESSAGE_SOURCE_UNKNOWN = 3;
  CHAT_MESSAGE_SOURCE_TOOL = 4;
  CHAT_MESSAGE_SOURCE_SYSTEM_PROMPT = 5;
}

// exa.chat_pb.CacheControlType (chat.proto:73), verbatim.
enum CacheControlType {
  CACHE_CONTROL_TYPE_UNSPECIFIED = 0;
  CACHE_CONTROL_TYPE_EPHEMERAL = 1;
}

// exa.chat_pb.PromptCacheOptions (chat.proto:362), complete.
message PromptCacheOptions {
  CacheControlType type = 1;
}

// exa.codeium_common_pb.ImageData (codeium_common.proto:3783), subset.
message ImageData {
  string base64_data = 1;
  string mime_type = 2;
}

// exa.codeium_common_pb.ChatToolCall (codeium_common.proto:3501), subset:
// id/name/args plus the invalid-json repair pair OMP falls back to.
message ChatToolCall {
  string id = 1;
  string name = 2;
  string arguments_json = 3;
  string invalid_json_str = 4;
  string invalid_json_err = 5;
}

// exa.chat_pb.ChatMessagePrompt (chat.proto:340), subset: only fields OMP's
// history builder sets (user/assistant/tool branches).
message ChatMessagePrompt {
  string message_id = 1;
  ChatMessageSource source = 2;
  string prompt = 3;
  repeated ChatToolCall tool_calls = 6;
  string tool_call_id = 7;
  PromptCacheOptions prompt_cache_options = 8;
  bool tool_result_is_error = 9;
  repeated ImageData images = 10;
  string thinking = 11;
  string signature = 12;
}

// exa.chat_pb.ChatToolDefinition (chat.proto:366), subset.
message ChatToolDefinition {
  string name = 1;
  string description = 2;
  string json_schema_string = 3;
  bool strict = 12;
}

// exa.chat_pb.ChatToolChoice (chat.proto:388), complete.
message ChatToolChoice {
  oneof choice {
    string option_name = 1;
    string tool_name = 2;
  }
}

// ---------------------------------------------------------------------------
// Router assignment (AssignModel). Complete pairs.
// ---------------------------------------------------------------------------

// exa.api_server_pb.ModelAssignment (api_server.proto:105).
message ModelAssignment {
  string assignment_jwt = 1;
  string model_uid = 2;
  repeated string harness_uids = 3;
}

// exa.api_server_pb.AssignModelRequest (api_server.proto:96).
message AssignModelRequest {
  Metadata metadata = 1;
  string model_router_uid = 2;
  string cascade_id = 3;
  ChatMessagePrompt chat_message_prompt = 5;
}

// exa.api_server_pb.AssignModelResponse (api_server.proto:111).
message AssignModelResponse {
  ModelAssignment assignment = 1;
}

// ---------------------------------------------------------------------------
// Chat (GetChatMessage). Subset per OMP buildDevinChatRequest (encode) and
// the stream consumer (decode).
// ---------------------------------------------------------------------------

// exa.api_server_pb.ChatMessageRequestType (api_server.proto:29), verbatim.
// The gateway only ever sends CASCADE.
enum ChatMessageRequestType {
  CHAT_MESSAGE_REQUEST_TYPE_UNSPECIFIED = 0;
  CHAT_MESSAGE_REQUEST_TYPE_GENERAL = 1;
  CHAT_MESSAGE_REQUEST_TYPE_CONTEXT_CHECK = 2;
  CHAT_MESSAGE_REQUEST_TYPE_PLAN = 3;
  CHAT_MESSAGE_REQUEST_TYPE_COMMAND = 4;
  CHAT_MESSAGE_REQUEST_TYPE_CASCADE = 5;
  CHAT_MESSAGE_REQUEST_TYPE_EVAL = 6;
  CHAT_MESSAGE_REQUEST_TYPE_WINDSURF_REVIEW = 7;
  CHAT_MESSAGE_REQUEST_TYPE_VIBE_AND_REPLACE = 8;
  CHAT_MESSAGE_REQUEST_TYPE_DEEPWIKI = 9;
  CHAT_MESSAGE_REQUEST_TYPE_DEVSTRAL = 10;
  CHAT_MESSAGE_REQUEST_TYPE_CODEMAP_GENERATION = 11;
  CHAT_MESSAGE_REQUEST_TYPE_CODEMAP_SUGGESTIONS = 12;
  CHAT_MESSAGE_REQUEST_TYPE_SMART_FRIEND = 13;
  CHAT_MESSAGE_REQUEST_TYPE_LIFEGUARD = 14;
  CHAT_MESSAGE_REQUEST_TYPE_CHECKPOINT = 15;
}

// exa.codeium_common_pb.ConversationalPlannerMode, verbatim.
// The gateway only ever sends DEFAULT.
enum ConversationalPlannerMode {
  CONVERSATIONAL_PLANNER_MODE_UNSPECIFIED = 0;
  CONVERSATIONAL_PLANNER_MODE_DEFAULT = 1;
  CONVERSATIONAL_PLANNER_MODE_READ_ONLY = 2;
  CONVERSATIONAL_PLANNER_MODE_NO_TOOL = 3;
  CONVERSATIONAL_PLANNER_MODE_EXPLORE = 4 [deprecated = true];
  CONVERSATIONAL_PLANNER_MODE_PLANNING = 5;
  CONVERSATIONAL_PLANNER_MODE_AUTO = 6;
}

// exa.codeium_common_pb.CompletionConfiguration (codeium_common.proto:1985),
// subset: the seven fields OMP sets.
message CompletionConfiguration {
  uint64 num_completions = 1;
  uint64 max_tokens = 2;
  uint64 max_newlines = 3;
  double temperature = 5;
  uint64 top_k = 7;
  double top_p = 8;
  repeated string stop_patterns = 9;
}

// exa.api_server_pb.GetChatMessageRequest, subset (only fields OMP sets;
// prompt_id and chat_model_name are notably absent upstream).
message GetChatMessageRequest {
  Metadata metadata = 1;
  string prompt = 2;
  repeated ChatMessagePrompt chat_message_prompts = 3;
  ChatMessageRequestType request_type = 7;
  CompletionConfiguration configuration = 8;
  repeated ChatToolDefinition tools = 10;
  bool disable_parallel_tool_calls = 11;
  ChatToolChoice tool_choice = 12;
  PromptCacheOptions system_prompt_cache_options = 13;
  string cascade_id = 16;
  ConversationalPlannerMode planner_mode = 20;
  string chat_model_uid = 21;
  string execution_id = 22;
  optional string model_assignment_jwt = 26;
}

// exa.codeium_common_pb.StopReason, verbatim. The gateway reads UNSPECIFIED
// (persistence gate) and MAX_TOKENS (done mapping).
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  STOP_REASON_INCOMPLETE = 1;
  STOP_REASON_STOP_PATTERN = 2;
  STOP_REASON_MAX_TOKENS = 3;
  STOP_REASON_MIN_LOG_PROB = 4;
  STOP_REASON_MAX_NEWLINES = 5;
  STOP_REASON_EXIT_SCOPE = 6;
  STOP_REASON_NONFINITE_LOGIT_OR_PROB = 7;
  STOP_REASON_FIRST_NON_WHITESPACE_LINE = 8;
  STOP_REASON_PARTIAL = 9;
  STOP_REASON_FUNCTION_CALL = 10;
  STOP_REASON_CONTENT_FILTER = 11;
  STOP_REASON_NON_INSERTION = 12;
  STOP_REASON_ERROR = 13;
}

// exa.codeium_common_pb.ModelUsageStats (codeium_common.proto:3646), subset.
message ModelUsageStats {
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 cache_write_tokens = 4;
  uint64 cache_read_tokens = 5;
  string model_uid = 9;
  string billing_model_uid = 10;
  string requested_model_uid = 11;
}

// exa.api_server_pb.GetChatMessageResponse, subset: only fields the OMP
// stream consumer reads (message routing, deltas, stop, usage, credits).
message GetChatMessageResponse {
  string message_id = 1;
  string delta_text = 3;
  StopReason stop_reason = 5;
  repeated ChatToolCall delta_tool_calls = 6;
  ModelUsageStats usage = 7;
  string delta_thinking = 9;
  string delta_signature = 10;
  float credit_cost = 14;
  float committed_credit_cost = 18;
  float committed_acu_cost = 22;
  optional string actual_model_uid = 23;
}
